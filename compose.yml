name: ailyn-local

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ailyn
      POSTGRES_USER: ailyn
      POSTGRES_PASSWORD: ailyn_local_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ailyn -d ailyn"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7.4.7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "ailyn_local_redis_password"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "ailyn_local_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ailyn_local_s3_access_key
      MINIO_ROOT_PASSWORD: ailyn_local_s3_secret_key
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://ailyn:ailyn_local_password@postgres:5432/ailyn?schema=public
      REDIS_URL: redis://:ailyn_local_redis_password@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ailyn-stage1
      S3_ACCESS_KEY: ailyn_local_s3_access_key
      S3_SECRET_KEY: ailyn_local_s3_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
    logging: *default-logging

  admin:
    build:
      context: .
      dockerfile: infra/docker/admin.Dockerfile
    env_file:
      - .env.example
    environment:
      API_INTERNAL_URL: http://api:3001/api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  minio_data:
