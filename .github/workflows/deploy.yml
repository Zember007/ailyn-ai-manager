name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate before deploy
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:scenarios
          pnpm build
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/ailyn_deploy
          chmod 600 ~/.ssh/ailyn_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Sync source
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".env" \
            --exclude ".env.*" \
            --exclude "backups" \
            --exclude "data" \
            -e "ssh -i ~/.ssh/ailyn_deploy -p ${DEPLOY_PORT:-22}" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/ailyn/app/"
      - name: Deploy on VPS
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          ssh -i ~/.ssh/ailyn_deploy -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/ailyn/app
          ENV_FILE=/opt/ailyn/.env.production ./scripts/provision-production-env.sh
          docker compose --env-file /opt/ailyn/.env.production -f compose.production.yml build
          docker compose --env-file /opt/ailyn/.env.production -f compose.production.yml run -T --rm api sh -lc 'node -e "new URL(process.env.DATABASE_URL); new URL(process.env.REDIS_URL)"' < /dev/null
          docker compose --env-file /opt/ailyn/.env.production -f compose.production.yml run -T --rm api sh -lc './apps/api/node_modules/.bin/prisma migrate deploy --schema apps/api/prisma/schema.prisma' < /dev/null
          docker compose --env-file /opt/ailyn/.env.production -f compose.production.yml up -d --remove-orphans --force-recreate minio api admin nginx
          REMOTE
      - name: Healthcheck
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          for attempt in {1..30}; do
            response="$(curl -fsS "http://${DEPLOY_HOST}/api/health")" || {
              sleep 5
              continue
            }
            printf '%s\n' "$response"
            case "$response" in
              *'"stage":"stage-1"'*) exit 0 ;;
            esac
            sleep 5
          done
          exit 1
